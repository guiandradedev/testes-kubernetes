# Refs
# https://docs.github.com/en/actions/tutorials/publish-packages/publish-docker-images#publishing-images-to-docker-hub

name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./projeto/webserver
    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v6

      - name: "Install node"
        uses: actions/setup-node@v7

      - name: "Install dependencies"
        run: npm install

      - name: "Run tests"
        run: npm run test

  build-and-push:
    name: "Build and push"
    runs-on: ubuntu-latest
    needs: test
    defaults:
      run:
        working-directory: ./projeto/webserver
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Log in to Docker Hub
        uses: docker/login-action@f4ef78c080cd8ba55a85445d5b36e214a81df20a
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: guiiandradedev/learning-cloud

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@3b5e8027fcad23fda98b2e3ac259d8d67585f671
        with:
          context: ./projeto/webserver
          file: ./projeto/webserver/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: index.docker.io/my-docker-hub-namespace/my-docker-hub-repository
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true